[package]
name = "wordcraft-android"
description = "WordCraft for Android (eframe NativeActivity, wgpu Vulkan with GLES fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "wordcraft_android"
crate-type = ["cdylib"]

# Every dependency is Android-only, so the crate is empty on other targets and
# `cargo build --workspace` on a desktop still succeeds.
[target.'cfg(target_os = "android")'.dependencies]
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
android-activity = "0.6"
android_logger = "0.14"
log = { workspace = true }

[package.metadata.android]
package = "ai.storyteller.wordcraft"
apk_name = "WordCraft"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
label = "WordCraft"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|screenLayout|smallestScreenSize|density|uiMode|navigation"
